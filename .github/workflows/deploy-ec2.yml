name: BioEarth deploy to EC2

on:
  workflow_run:
    workflows: ["BioEarth CI"]
    types: [completed]
    branches: ["main"]
  workflow_dispatch:
    inputs:
      commit_sha:
        description: "Commit SHA of the validated image to deploy"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
  EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
  CONTAINER_NAME: ${{ vars.CONTAINER_NAME }}
  IMAGE_TAG: >-
    ${{ github.event_name == 'workflow_run' &&
        github.event.workflow_run.head_sha ||
        inputs.commit_sha }}

jobs:
  deploy:
    if: >-
      ${{ github.event_name == 'workflow_dispatch' ||
          (github.event.workflow_run.conclusion == 'success' &&
           github.event.workflow_run.event == 'push') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: >-
            ${{ github.event_name == 'workflow_run' &&
                github.event.workflow_run.head_sha ||
                inputs.commit_sha }}

      - name: Initialize metrics
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p metrics
          workflow_started_epoch="$(date +%s)"
          echo "WORKFLOW_STARTED_EPOCH=$workflow_started_epoch" >> "$GITHUB_ENV"
          cat > metrics/deployment.json <<EOF
          {
            "workflow": "${GITHUB_WORKFLOW}",
            "run_id": "${GITHUB_RUN_ID}",
            "run_attempt": "${GITHUB_RUN_ATTEMPT}",
            "commit_sha": "${IMAGE_TAG}",
            "event": "${GITHUB_EVENT_NAME}",
            "status": "started",
            "deployment_status": "started",
            "rollback": false,
            "rollback_status": "not_required",
            "failure_class": null,
            "workflow_started_epoch": $workflow_started_epoch
          }
          EOF

      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Deploy image through Systems Manager
        id: deploy
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          set -euo pipefail
          image_uri="$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          echo "IMAGE_URI=$image_uri" >> "$GITHUB_ENV"
          echo "DEPLOYMENT_STARTED_EPOCH=$(date +%s)" >> "$GITHUB_ENV"
          remote_script="$(cat <<EOF
          set -eu
          IMAGE_URI='$image_uri'
          CONTAINER='$CONTAINER_NAME'
          OLD_IMAGE=\$(docker inspect --format='{{.Config.Image}}' "\$CONTAINER" 2>/dev/null || true)
          echo "OLD_IMAGE=\$OLD_IMAGE"
          aws ecr get-login-password --region '$AWS_REGION' |
            docker login --username AWS --password-stdin "\${IMAGE_URI%%/*}"
          docker pull "\$IMAGE_URI"
          docker rm --force "\$CONTAINER" 2>/dev/null || true
          docker run --detach --restart unless-stopped \
            --name "\$CONTAINER" --publish 8080:8080 "\$IMAGE_URI"
          sleep 5
          if curl --fail --silent --show-error http://localhost:8080/health; then
            echo "DEPLOYMENT_STATUS=success"
            echo "ROLLBACK=false"
            exit 0
          fi

          echo "DEPLOYMENT_STATUS=failed"
          echo "FAILURE_CLASS=health_check_failure"
          docker rm --force "\$CONTAINER" 2>/dev/null || true

          if [ -n "\$OLD_IMAGE" ]; then
            docker pull "\$OLD_IMAGE"
            docker run --detach --restart unless-stopped \
              --name "\$CONTAINER" --publish 8080:8080 "\$OLD_IMAGE"
            sleep 5
            if curl --fail --silent --show-error http://localhost:8080/health; then
              echo "ROLLBACK=true"
              echo "ROLLBACK_STATUS=recovered"
              exit 1
            fi
          fi

          echo "ROLLBACK=true"
          echo "ROLLBACK_STATUS=failed"
          exit 1
          EOF
          )"
          parameters="$(jq -cn --arg command "$remote_script" '{commands:[$command]}')"
          command_id="$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters "$parameters" \
            --query "Command.CommandId" \
            --output text)"
          echo "COMMAND_ID=$command_id" >> "$GITHUB_OUTPUT"

      - name: Wait for deployment command
        run: |
          set -euo pipefail
          for attempt in {1..30}; do
            status="$(aws ssm get-command-invocation \
              --command-id "${{ steps.deploy.outputs.COMMAND_ID }}" \
              --instance-id "$EC2_INSTANCE_ID" \
              --query "Status" \
              --output text)"
            echo "SSM status: $status"
            case "$status" in
              Success)
                aws ssm get-command-invocation \
                  --command-id "${{ steps.deploy.outputs.COMMAND_ID }}" \
                  --instance-id "$EC2_INSTANCE_ID" \
                  --query "StandardOutputContent" \
                  --output text | tee deployment-output.txt
                exit 0
                ;;
              Failed|Cancelled|TimedOut|Cancelling)
                aws ssm get-command-invocation \
                  --command-id "${{ steps.deploy.outputs.COMMAND_ID }}" \
                  --instance-id "$EC2_INSTANCE_ID" \
                  --query "StandardOutputContent" \
                  --output text | tee deployment-output.txt
                aws ssm get-command-invocation \
                  --command-id "${{ steps.deploy.outputs.COMMAND_ID }}" \
                  --instance-id "$EC2_INSTANCE_ID" \
                  --query "StandardErrorContent" \
                  --output text
                exit 1
                ;;
            esac
            sleep 2
          done
          echo "Timed out waiting for the SSM deployment command."
          exit 1

      - name: Finalize successful metrics
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          finished_epoch="$(date +%s)"
          workflow_duration="$((finished_epoch - WORKFLOW_STARTED_EPOCH))"
          deployment_duration="$((finished_epoch - DEPLOYMENT_STARTED_EPOCH))"
          commit_timestamp="$(git show -s --format=%cI "$IMAGE_TAG")"
          commit_timestamp_epoch="$(date -d "$commit_timestamp" +%s)"
          lead_time="$((finished_epoch - commit_timestamp_epoch))"
          jq \
            --arg status "success" \
            --arg commit_timestamp "$commit_timestamp" \
            --arg image_uri "${IMAGE_URI:-}" \
            --argjson finished_epoch "$finished_epoch" \
            --argjson workflow_duration "$workflow_duration" \
            --argjson deployment_duration "$deployment_duration" \
            --argjson lead_time "$lead_time" \
            '.status = $status
             | .deployment_status = $status
             | .commit_timestamp = $commit_timestamp
             | .finished_epoch = $finished_epoch
             | .deployment_finished_epoch = $finished_epoch
             | .workflow_finished_epoch = $finished_epoch
             | .build_test_deploy_duration_seconds = $workflow_duration
             | .deployment_duration_seconds = $deployment_duration
             | .lead_time_seconds = $lead_time
             | .image_uri = $image_uri
              | .rollback = false
              | .rollback_status = "not_required"' \
             metrics/deployment.json > metrics/deployment.tmp
          mv metrics/deployment.tmp metrics/deployment.json

      - name: Finalize failed metrics
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          finished_epoch="$(date +%s)"
          workflow_duration="$((finished_epoch - WORKFLOW_STARTED_EPOCH))"
          rollback="false"
          rollback_status="not_attempted"
          failure_class="pipeline_or_deployment_failure"
          if [[ -f deployment-output.txt ]]; then
            if grep -q '^ROLLBACK=true$' deployment-output.txt; then
              rollback="true"
            fi
            if grep -q '^ROLLBACK_STATUS=recovered$' deployment-output.txt; then
              rollback_status="recovered"
            elif grep -q '^ROLLBACK_STATUS=failed$' deployment-output.txt; then
              rollback_status="failed"
            fi
            if grep -q '^FAILURE_CLASS=health_check_failure$' deployment-output.txt; then
              failure_class="health_check_failure"
            fi
          fi
          jq \
            --arg status "failure" \
            --argjson finished_epoch "$finished_epoch" \
            --argjson workflow_duration "$workflow_duration" \
            --argjson rollback "$rollback" \
            --arg rollback_status "$rollback_status" \
            --arg failure_class "$failure_class" \
            '.status = $status
             | .deployment_status = $status
             | .finished_epoch = $finished_epoch
             | .workflow_finished_epoch = $finished_epoch
             | .build_test_deploy_duration_seconds = $workflow_duration
             | .failure_class = $failure_class
             | .rollback = $rollback
             | .rollback_status = $rollback_status' \
            metrics/deployment.json > metrics/deployment.tmp
          mv metrics/deployment.tmp metrics/deployment.json

      - name: Upload deployment metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deployment-metrics-${{ github.run_id }}-${{ github.run_attempt }}
          path: metrics/deployment.json
          if-no-files-found: error

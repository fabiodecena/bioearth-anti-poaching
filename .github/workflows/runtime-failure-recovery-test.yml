name: BioEarth runtime failure and recovery test

on:
  workflow_dispatch:
    inputs:
      good_image_tag:
        description: "Known-good ECR image tag to restore"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
  EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
  CONTAINER_NAME: ${{ vars.CONTAINER_NAME }}
  GOOD_IMAGE_TAG: ${{ inputs.good_image_tag }}

jobs:
  failure-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Initialize metrics
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p metrics
          cat > metrics/failure-recovery.json <<EOF
          {
            "workflow": "${GITHUB_WORKFLOW}",
            "run_id": "${GITHUB_RUN_ID}",
            "run_attempt": "${GITHUB_RUN_ATTEMPT}",
            "event": "${GITHUB_EVENT_NAME}",
            "good_image_tag": "${GOOD_IMAGE_TAG}",
            "failure_injected": true,
            "failure_type": "runtime_health_check",
            "recovery_status": "started"
          }
          EOF

      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Inject runtime failure and recover
        id: recovery
        shell: bash
        run: |
          set -euo pipefail
          account_id="$(aws sts get-caller-identity --query Account --output text)"
          registry="$account_id.dkr.ecr.${AWS_REGION}.amazonaws.com"
          good_image="$registry/$ECR_REPOSITORY:$GOOD_IMAGE_TAG"
          remote_script="$(cat <<EOF
          set -eu
          GOOD_IMAGE='$good_image'
          CONTAINER='$CONTAINER_NAME'
          REGISTRY='$registry'
          aws ecr get-login-password --region '$AWS_REGION' | docker login --username AWS --password-stdin "\$REGISTRY"
          docker pull "\$GOOD_IMAGE"
          failure_epoch=\$(date +%s)
          docker rm --force "\$CONTAINER" 2>/dev/null || true
          docker run --detach --restart no --name "\$CONTAINER" --publish 8080:8080 "\$GOOD_IMAGE" sh -c 'exit 1'
          sleep 3
          if curl --fail --silent http://localhost:8080/health >/dev/null; then
            echo "FAILURE_NOT_OBSERVED"
            exit 1
          fi
          docker rm --force "\$CONTAINER" 2>/dev/null || true
          docker run --detach --restart unless-stopped --name "\$CONTAINER" --publish 8080:8080 "\$GOOD_IMAGE"
          for attempt in \$(seq 1 15); do
            if curl --fail --silent http://localhost:8080/health >/dev/null; then
              recovery_epoch=\$(date +%s)
              echo "FAILURE_EPOCH=\$failure_epoch"
              echo "RECOVERY_EPOCH=\$recovery_epoch"
              echo "MTTR_SECONDS=\$((recovery_epoch - failure_epoch))"
              exit 0
            fi
            sleep 2
          done
          echo "RECOVERY_FAILED"
          exit 1
          EOF
          )"
          parameters="$(jq -cn --arg command "$remote_script" '{commands:[$command]}')"
          command_id="$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters "$parameters" \
            --query "Command.CommandId" \
            --output text)"
          echo "COMMAND_ID=$command_id" >> "$GITHUB_OUTPUT"

          for attempt in {1..30}; do
            status="$(aws ssm get-command-invocation \
              --command-id "$command_id" \
              --instance-id "$EC2_INSTANCE_ID" \
              --query "Status" \
              --output text)"
            case "$status" in
              Success)
                aws ssm get-command-invocation \
                  --command-id "$command_id" \
                  --instance-id "$EC2_INSTANCE_ID" \
                  --query "StandardOutputContent" \
                  --output text | tee recovery-output.txt
                exit 0
                ;;
              Failed|Cancelled|TimedOut|Cancelling)
                aws ssm get-command-invocation \
                  --command-id "$command_id" \
                  --instance-id "$EC2_INSTANCE_ID" \
                  --query "{stdout:StandardOutputContent,stderr:StandardErrorContent}" \
                  --output json
                exit 1
                ;;
            esac
            sleep 2
          done
          echo "Timed out waiting for recovery."
          exit 1

      - name: Finalize recovery metrics
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          failure_epoch="$(sed -n 's/^FAILURE_EPOCH=//p' recovery-output.txt)"
          recovery_epoch="$(sed -n 's/^RECOVERY_EPOCH=//p' recovery-output.txt)"
          mttr_seconds="$(sed -n 's/^MTTR_SECONDS=//p' recovery-output.txt)"
          jq \
            --arg status "recovered" \
            --argjson failure_epoch "$failure_epoch" \
            --argjson recovery_epoch "$recovery_epoch" \
            --argjson mttr_seconds "$mttr_seconds" \
            '.recovery_status = $status
             | .failure_epoch = $failure_epoch
             | .recovery_epoch = $recovery_epoch
             | .mttr_seconds = $mttr_seconds
             | .change_failure_count = 1' \
            metrics/failure-recovery.json > metrics/failure-recovery.tmp
          mv metrics/failure-recovery.tmp metrics/failure-recovery.json

      - name: Finalize failed recovery metrics
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          jq \
            '.recovery_status = "failed"
             | .change_failure_count = 1' \
            metrics/failure-recovery.json > metrics/failure-recovery.tmp
          mv metrics/failure-recovery.tmp metrics/failure-recovery.json

      - name: Upload failure and recovery metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: failure-recovery-metrics-${{ github.run_id }}-${{ github.run_attempt }}
          path: metrics/failure-recovery.json
          if-no-files-found: error

name: AWS identity test

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  verify-aws-identity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect OIDC claims safely
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl --fail --silent \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com")"
          token="$(jq --raw-output '.value' <<< "$response")"
          payload="$(cut -d '.' -f 2 <<< "$token")"
          padding=$((4 - ${#payload} % 4))
          if [ "$padding" -lt 4 ]; then
            payload="${payload}$(printf '=%.0s' $(seq 1 "$padding"))"
          fi
          printf '%s' "$payload" | base64 --decode 2>/dev/null | jq '{
            iss,
            aud,
            sub,
            repository,
            ref,
            event_name,
            workflow_ref
          }'

      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Verify assumed identity
        run: aws sts get-caller-identity

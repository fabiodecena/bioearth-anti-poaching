name: BioEarth deploy to EC2

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
  EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
  CONTAINER_NAME: ${{ vars.CONTAINER_NAME }}
  IMAGE_TAG: ${{ github.sha }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Initialize metrics
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p metrics
          echo "WORKFLOW_STARTED_EPOCH=$(date +%s)" >> "$GITHUB_ENV"
          cat > metrics/deployment.json <<EOF
          {
            "workflow": "${GITHUB_WORKFLOW}",
            "run_id": "${GITHUB_RUN_ID}",
            "run_attempt": "${GITHUB_RUN_ATTEMPT}",
            "commit_sha": "${GITHUB_SHA}",
            "event": "${GITHUB_EVENT_NAME}",
            "status": "started"
          }
          EOF

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Run unit tests
        run: python -m pytest -q

      - name: Build Docker image
        env:
          LOCAL_IMAGE: bioearth-anti-poaching:${{ github.sha }}
        run: docker build --tag "$LOCAL_IMAGE" .

      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Push image to Amazon ECR
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          LOCAL_IMAGE: bioearth-anti-poaching:${{ github.sha }}
        run: |
          set -euo pipefail
          image_uri="$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          docker tag "$LOCAL_IMAGE" "$image_uri"
          docker push "$image_uri"
          echo "IMAGE_URI=$image_uri" >> "$GITHUB_ENV"

      - name: Deploy image through Systems Manager
        id: deploy
        run: |
          set -euo pipefail
          command_id="$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters "commands=[
              \"set -eu\",
              \"aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin ${IMAGE_URI%%/*}\",
              \"docker pull $IMAGE_URI\",
              \"docker rm --force $CONTAINER_NAME 2>/dev/null || true\",
              \"docker run --detach --restart unless-stopped --name $CONTAINER_NAME --publish 8080:8080 $IMAGE_URI\",
              \"sleep 5\",
              \"curl --fail --silent --show-error http://localhost:8080/health\"
            ]" \
            --query "Command.CommandId" \
            --output text)"
          echo "COMMAND_ID=$command_id" >> "$GITHUB_OUTPUT"

      - name: Wait for deployment command
        run: |
          set -euo pipefail
          for attempt in {1..30}; do
            status="$(aws ssm get-command-invocation \
              --command-id "${{ steps.deploy.outputs.COMMAND_ID }}" \
              --instance-id "$EC2_INSTANCE_ID" \
              --query "Status" \
              --output text)"
            echo "SSM status: $status"
            case "$status" in
              Success)
                aws ssm get-command-invocation \
                  --command-id "${{ steps.deploy.outputs.COMMAND_ID }}" \
                  --instance-id "$EC2_INSTANCE_ID" \
                  --query "StandardOutputContent" \
                  --output text
                exit 0
                ;;
              Failed|Cancelled|TimedOut|Cancelling)
                aws ssm get-command-invocation \
                  --command-id "${{ steps.deploy.outputs.COMMAND_ID }}" \
                  --instance-id "$EC2_INSTANCE_ID" \
                  --query "{stdout:StandardOutputContent,stderr:StandardErrorContent}" \
                  --output json
                exit 1
                ;;
            esac
            sleep 2
          done
          echo "Timed out waiting for the SSM deployment command."
          exit 1

      - name: Finalize successful metrics
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          finished_epoch="$(date +%s)"
          duration="$((finished_epoch - WORKFLOW_STARTED_EPOCH))"
          commit_timestamp="$(git show -s --format=%cI "$GITHUB_SHA")"
          jq \
            --arg status "success" \
            --arg commit_timestamp "$commit_timestamp" \
            --arg image_uri "${IMAGE_URI:-}" \
            --argjson finished_epoch "$finished_epoch" \
            --argjson duration "$duration" \
            '.status = $status
             | .commit_timestamp = $commit_timestamp
             | .finished_epoch = $finished_epoch
             | .deployment_finished_epoch = $finished_epoch
             | .build_test_deploy_duration_seconds = $duration
             | .image_uri = $image_uri' \
            metrics/deployment.json > metrics/deployment.tmp
          mv metrics/deployment.tmp metrics/deployment.json

      - name: Finalize failed metrics
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          finished_epoch="$(date +%s)"
          duration="$((finished_epoch - WORKFLOW_STARTED_EPOCH))"
          jq \
            --arg status "failure" \
            --argjson finished_epoch "$finished_epoch" \
            --argjson duration "$duration" \
            '.status = $status
             | .finished_epoch = $finished_epoch
             | .build_test_deploy_duration_seconds = $duration' \
            metrics/deployment.json > metrics/deployment.tmp
          mv metrics/deployment.tmp metrics/deployment.json

      - name: Upload deployment metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deployment-metrics-${{ github.run_id }}-${{ github.run_attempt }}
          path: metrics/deployment.json
          if-no-files-found: error

name: BioEarth CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  validate-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Run unit tests
        run: python -m pytest -q

      - name: Build Docker image
        env:
          IMAGE_TAG: bioearth-anti-poaching:${{ github.sha }}
        run: docker build --tag "$IMAGE_TAG" .

      - name: Start local validation container
        env:
          IMAGE_TAG: bioearth-anti-poaching:${{ github.sha }}
        run: docker run --detach --rm --name bioearth-ci-app --publish 8080:8080 "$IMAGE_TAG"

      - name: Run local smoke tests
        run: |
          for attempt in {1..10}; do
            if curl --fail --silent --show-error http://localhost:8080/health; then
              echo
              curl --fail --silent --show-error http://localhost:8080/
              echo
              exit 0
            fi
            sleep 2
          done
          docker logs bioearth-ci-app
          exit 1

      - name: Stop local validation container
        if: always()
        run: docker stop bioearth-ci-app

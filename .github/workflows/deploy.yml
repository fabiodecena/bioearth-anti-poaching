name: BioEarth CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}

jobs:
  validate-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Run unit tests
        run: python -m pytest -q

      - name: Build Docker image
        env:
          IMAGE_TAG: bioearth-anti-poaching:${{ github.sha }}
        run: docker build --tag "$IMAGE_TAG" .

      - name: Start local validation container
        env:
          IMAGE_TAG: bioearth-anti-poaching:${{ github.sha }}
        run: docker run --detach --rm --name bioearth-ci-app --publish 8080:8080 "$IMAGE_TAG"

      - name: Run local smoke tests
        run: |
          for attempt in {1..10}; do
            if curl --fail --silent --show-error http://localhost:8080/health; then
              echo
              curl --fail --silent --show-error http://localhost:8080/
              echo
              exit 0
            fi
            sleep 2
          done
          docker logs bioearth-ci-app
          exit 1

      - name: Stop local validation container
        if: always()
        run: docker stop bioearth-ci-app

      - name: Configure AWS credentials with OIDC
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Publish validated image to Amazon ECR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          LOCAL_IMAGE: bioearth-anti-poaching:${{ github.sha }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail
          image_uri="$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          docker tag "$LOCAL_IMAGE" "$image_uri"
          docker push "$image_uri"

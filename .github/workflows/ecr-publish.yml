name: BioEarth ECR publish

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
  IMAGE_TAG: ${{ github.sha }}

jobs:
  publish-image:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Initialize metrics
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p metrics
          echo "WORKFLOW_STARTED_EPOCH=$(date +%s)" >> "$GITHUB_ENV"
          cat > metrics/ecr-publish.json <<EOF
          {
            "workflow": "${GITHUB_WORKFLOW}",
            "run_id": "${GITHUB_RUN_ID}",
            "run_attempt": "${GITHUB_RUN_ATTEMPT}",
            "commit_sha": "${GITHUB_SHA}",
            "event": "${GITHUB_EVENT_NAME}",
            "status": "started"
          }
          EOF

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Run unit tests
        run: python -m pytest -q

      - name: Build Docker image
        env:
          LOCAL_IMAGE: bioearth-anti-poaching:${{ github.sha }}
        run: docker build --tag "$LOCAL_IMAGE" .

      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Push image to Amazon ECR
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          LOCAL_IMAGE: bioearth-anti-poaching:${{ github.sha }}
        run: |
          set -euo pipefail
          image_uri="$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          docker tag "$LOCAL_IMAGE" "$image_uri"
          docker push "$image_uri"
          echo "IMAGE_URI=$image_uri" >> "$GITHUB_ENV"

      - name: Finalize successful metrics
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          finished_epoch="$(date +%s)"
          duration="$((finished_epoch - WORKFLOW_STARTED_EPOCH))"
          commit_timestamp="$(git show -s --format=%cI "$GITHUB_SHA")"
          jq \
            --arg status "success" \
            --arg commit_timestamp "$commit_timestamp" \
            --arg image_uri "${IMAGE_URI:-}" \
            --argjson finished_epoch "$finished_epoch" \
            --argjson duration "$duration" \
            '.status = $status
             | .commit_timestamp = $commit_timestamp
             | .finished_epoch = $finished_epoch
             | .build_test_publish_duration_seconds = $duration
             | .image_uri = $image_uri' \
            metrics/ecr-publish.json > metrics/ecr-publish.tmp
          mv metrics/ecr-publish.tmp metrics/ecr-publish.json

      - name: Finalize failed metrics
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          finished_epoch="$(date +%s)"
          duration="$((finished_epoch - WORKFLOW_STARTED_EPOCH))"
          jq \
            --arg status "failure" \
            --argjson finished_epoch "$finished_epoch" \
            --argjson duration "$duration" \
            '.status = $status
             | .finished_epoch = $finished_epoch
             | .build_test_publish_duration_seconds = $duration' \
            metrics/ecr-publish.json > metrics/ecr-publish.tmp
          mv metrics/ecr-publish.tmp metrics/ecr-publish.json

      - name: Upload ECR publish metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ecr-publish-metrics-${{ github.run_id }}-${{ github.run_attempt }}
          path: metrics/ecr-publish.json
          if-no-files-found: error
